<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Konsola Markerów</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  /* Layout: konsola — lewy rail (topik + scrollspy tur), prawy panel to ciagly scroll calej rozmowy. */
  :root{
    --bg:#eef1f5; --surface:#ffffff; --surface2:#f3f5f8;
    --border:#d8dee6; --border-strong:#c3ccd6;
    --fg:#161b22; --fg2:#3a4552; --muted:#697585;
    --accent:#4b57c6;
    --c-ok:#2f9e44; --c-partial:#c77d0a; --c-supp:#1c74d4; --c-guess:#e8590c;
    --c-neutral:#74818f; --c-action:#7048e8; --c-done:#0b9b7a; --c-opinion:#5244c0; --c-danger:#e03131;
    --sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --r:12px; --bar:57px; color-scheme:light;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#0e1117; --surface:#161b22; --surface2:#1b212b;
    --border:#272e39; --border-strong:#3a424f;
    --fg:#e7ebf0; --fg2:#b7c0cc; --muted:#8a95a3; --accent:#8a93ff;
    --c-ok:#51cf66; --c-partial:#ffc14d; --c-supp:#64a8f0; --c-guess:#ff922b;
    --c-neutral:#95a1b0; --c-action:#b197fc; --c-done:#38d9a9; --c-opinion:#a79bff; --c-danger:#ff6b6b;
    color-scheme:dark; } }
  :root[data-theme="dark"]{
    --bg:#0e1117; --surface:#161b22; --surface2:#1b212b;
    --border:#272e39; --border-strong:#3a424f;
    --fg:#e7ebf0; --fg2:#b7c0cc; --muted:#8a95a3; --accent:#8a93ff;
    --c-ok:#51cf66; --c-partial:#ffc14d; --c-supp:#64a8f0; --c-guess:#ff922b;
    --c-neutral:#95a1b0; --c-action:#b197fc; --c-done:#38d9a9; --c-opinion:#a79bff; --c-danger:#ff6b6b;
    color-scheme:dark; }
  *{box-sizing:border-box}
  html,body{margin:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{transition:none!important}}

  .app{display:flex;align-items:stretch;min-height:100vh}

  /* rail */
  .rail{flex:0 0 300px;width:300px;background:var(--surface);border-right:1px solid var(--border);
        position:sticky;top:0;align-self:flex-start;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .rail-head{padding:18px}
  .brandrow{display:flex;align-items:center;gap:9px}
  .glyph{width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:600;flex:0 0 auto}
  .applabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .topic{margin-top:12px;font-size:15.5px;font-weight:600;line-height:1.35;text-wrap:balance}
  .updated{margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .rail-scroll{overflow:auto;padding:6px 8px 14px;flex:1;border-top:1px solid var(--border)}
  .rail-label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:12px 10px 7px;font-weight:600}
  .navitem{width:100%;text-align:left;border:0;background:none;color:var(--fg2);cursor:pointer;font-family:inherit;font-size:13px;
           padding:9px 11px;border-radius:9px;display:flex;gap:10px;align-items:flex-start}
  .navitem:hover{background:var(--surface2)}
  .navitem.on{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--fg)}
  .navitem.on .nn{color:var(--accent)}
  .navitem .nn{font-family:var(--mono);font-weight:600;color:var(--muted);min-width:22px;font-variant-numeric:tabular-nums}
  .navitem .nt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .navitem .marks{display:flex;gap:4px;margin-left:auto;padding-left:6px;flex:0 0 auto}
  .dot{width:7px;height:7px;border-radius:50%;margin-top:5px}
  .dot.inc{background:var(--c-partial)} .dot.act{background:var(--c-action)} .dot.dng{background:var(--c-danger)}

  /* main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);
          backdrop-filter:saturate(1.3) blur(9px);border-bottom:1px solid var(--border);
          display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 22px;min-height:var(--bar)}
  .search{flex:1;min-width:150px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 11px}
  .search input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font-family:inherit;font-size:13px;outline:none}
  .search svg{flex:0 0 auto;color:var(--muted)}
  .seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:2px}
  .seg button{border:0;background:none;color:var(--muted);cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:500;padding:6px 11px;border-radius:7px;white-space:nowrap}
  .seg button.on{background:var(--accent);color:#fff}
  .iconbtn{flex:0 0 auto;width:34px;height:34px;border:1px solid var(--border);background:var(--surface);color:var(--fg2);border-radius:9px;cursor:pointer;display:grid;place-items:center}
  .iconbtn:hover{color:var(--fg);border-color:var(--border-strong)}

  .stream{padding:4px 22px 60px;max-width:820px;width:100%}

  /* tura */
  .turn{padding:30px 0 26px;border-top:1px solid var(--border);scroll-margin-top:calc(var(--bar) + 10px)}
  .turn:first-child{border-top:0}
  .turn-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
  .turn-eyebrow .hash{color:var(--accent)}
  .prompt{border-left:2px solid var(--accent);padding:2px 0 2px 14px;font-size:17px;font-weight:600;line-height:1.4;color:var(--fg);text-wrap:pretty}
  .answers{margin-top:18px;display:flex;flex-direction:column;gap:14px}

  /* item: teza (summary) + detal (zwijalny) */
  .itemwrap{display:flex;flex-direction:column}
  .q{color:var(--muted);font-size:13px;margin-bottom:7px;line-height:1.4}
  .q .qn{font-family:var(--mono);color:var(--accent);font-weight:600;margin-right:5px}
  .item{border:1px solid var(--border);border-left:3px solid var(--stripe,var(--border-strong));border-radius:var(--r);background:var(--surface);overflow:hidden}
  .item>summary{list-style:none;cursor:pointer;padding:14px 15px;display:flex;flex-direction:column;gap:10px}
  .item>summary::-webkit-details-marker{display:none}
  .teza-line{display:flex;gap:12px;align-items:flex-start}
  .teza{flex:1;min-width:0;font-size:16px;font-weight:600;line-height:1.42;color:var(--fg);text-wrap:pretty}
  .teza strong{font-weight:700}
  .caret{flex:0 0 auto;color:var(--muted);margin-top:4px;transition:transform .18s ease}
  .item[open] .caret{transform:rotate(90deg)}
  .mrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .badge{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:3px 9px 3px 7px;border-radius:7px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;
         color:var(--h);background:color-mix(in srgb,var(--h) 13%,transparent);border:1px solid color-mix(in srgb,var(--h) 34%,transparent)}
  .badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--h);flex:0 0 auto}
  .chip{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:999px;text-transform:lowercase;
        color:var(--h);background:color-mix(in srgb,var(--h) 13%,transparent)}
  .chip.pelne{--h:var(--c-ok)} .chip.czesciowe{--h:var(--c-partial)} .chip.otwarte{--h:var(--c-action)}
  .detal{border-top:1px solid var(--border);padding:13px 15px 15px;color:var(--fg2);font-size:14.5px;line-height:1.62;max-width:68ch}
  .detal strong{color:var(--fg);font-weight:600}
  .teza code,.detal code{font-family:var(--mono);font-size:.9em;background:var(--surface2);padding:1px 5px;border-radius:5px;border:1px solid var(--border)}
  .dowody{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
  .dowody li{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;gap:7px;align-items:flex-start;word-break:break-all}
  .dowody li svg{flex:0 0 auto;margin-top:2px;opacity:.6}
  .dowody a{color:var(--c-supp);text-decoration:none}
  .dowody a:hover{text-decoration:underline}

  /* callouts */
  .callout{border-radius:var(--r);padding:13px 15px;margin-top:16px;border:1px solid}
  .callout h4{margin:0 0 8px;font-size:12px;letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:center;gap:8px;font-weight:600}
  .callout.danger{border-color:color-mix(in srgb,var(--c-danger) 50%,var(--border));background:color-mix(in srgb,var(--c-danger) 10%,transparent)}
  .callout.danger h4{color:var(--c-danger)} .callout.danger p{margin:0;color:var(--fg2)}
  .callout.action{border-color:color-mix(in srgb,var(--c-action) 50%,var(--border));background:color-mix(in srgb,var(--c-action) 9%,transparent)}
  .callout.action h4{color:var(--c-action)}
  .need{display:flex;flex-direction:column;gap:7px;margin-top:11px}
  .need label{font-size:13.5px;color:var(--fg);font-weight:500}
  .need input{font-family:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:9px 11px;outline:none;width:100%}
  .need input:focus{border-color:var(--c-action);box-shadow:0 0 0 3px color-mix(in srgb,var(--c-action) 22%,transparent)}

  /* kolektor */
  .collector{margin-top:34px;border:1px solid var(--border-strong);border-radius:14px;background:var(--surface);padding:18px 18px 20px}
  .collector h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:9px}
  .collector h3 .k{font-family:var(--mono);color:var(--c-action);font-size:12px;border:1px solid color-mix(in srgb,var(--c-action) 40%,var(--border));padding:2px 7px;border-radius:6px}
  .collector .hint{color:var(--muted);font-size:12.5px;margin:0 0 15px}
  .collector .empty2{color:var(--muted);font-size:13px;padding:6px 0}
  .citem{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--border)}
  .citem:first-of-type{border-top:0}
  .citem .src{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .citem label{font-size:14px;font-weight:500}
  .citem input{font-family:inherit;font-size:14px;color:var(--fg);background:var(--surface2);border:1px solid var(--border-strong);border-radius:8px;padding:9px 11px;outline:none}
  .citem input:focus{border-color:var(--c-action);box-shadow:0 0 0 3px color-mix(in srgb,var(--c-action) 22%,transparent)}
  .collector-foot{display:flex;gap:10px;align-items:center;margin-top:16px}
  .btn{font-family:inherit;font-size:13.5px;font-weight:600;border-radius:9px;padding:9px 15px;cursor:pointer;border:1px solid transparent}
  .btn.primary{background:var(--c-action);color:#fff}
  .btn.primary:hover{filter:brightness(1.06)}
  .copied{font-size:12.5px;color:var(--c-done);font-family:var(--mono)}

  .empty{color:var(--muted);text-align:center;padding:48px 0;font-size:13px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  @media (max-width:760px){
    .app{flex-direction:column}
    .rail{position:static;width:auto;flex:none;height:auto;border-right:0;border-bottom:1px solid var(--border)}
    .rail-scroll{max-height:40vh}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail-head">
      <div class="brandrow"><span class="glyph">[!]</span><span class="applabel" id="applabel">Konsola Markerów</span></div>
      <div class="topic" id="topic"></div>
      <div class="updated" id="updated"></div>
    </div>
    <div class="rail-scroll">
      <div class="rail-label">Tury rozmowy</div>
      <div id="nav"></div>
    </div>
  </aside>

  <section class="main">
    <div class="topbar">
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" placeholder="Szukaj w rozmowie…">
      </label>
      <div class="seg" id="filters">
        <button data-f="all" class="on">Wszystkie</button>
        <button data-f="niekompletne">Otwarte</button>
        <button data-f="akcja">Wymaga akcji</button>
      </div>
      <button class="iconbtn" id="theme" title="Przełącz motyw" aria-label="Przełącz motyw">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
    </div>
    <div class="stream" id="stream"></div>
  </section>
</div>

<script src="session.js"></script>
<script>
(function(){
  var S = window.SESSION || {turns:[]};
  var HUE = {
    FAKT:"--c-ok", CZESCIOWO:"--c-partial", IMPORTANT:"--c-partial",
    PRZYPUSZCZENIE:"--c-supp", TWOJE:"--c-supp", ZGADYWANIE:"--c-guess",
    ZALOZENIE:"--c-neutral", NIEWIEM:"--c-neutral",
    POTRZEBUJE:"--c-action", PROPOZYCJA:"--c-action",
    ZROBILEM:"--c-done", OPINIA:"--c-opinion", DANGER:"--c-danger", KLAMALEM:"--c-danger"
  };
  var STLABEL={pelne:"pełne",czesciowe:"częściowe",otwarte:"otwarte"};
  var state = { filter:"all", q:"" };
  var answers = {};
  try{ answers = JSON.parse(localStorage.getItem("km-answers")||"{}"); }catch(e){ answers={}; }

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function attr(s){ return esc(s); }
  function md(s){ s=esc(s); s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>"); s=s.replace(/`([^`]+)`/g,"<code>$1</code>"); return s; }
  function keyOf(m){ return m.replace(/[\[\]!]/g,"").replace(/\s+/g,"").toUpperCase(); }
  function markers(s){ return (s||"").match(/\[[^\]]+\]/g) || []; }
  function badge(m){ var h=HUE[keyOf(m)]||"--muted"; return '<span class="badge" style="--h:var('+h+')">'+esc(m)+'</span>'; }
  function badges(s){ return markers(s).map(badge).join(""); }
  function statusOf(m){ var k=markers(m).map(keyOf);
    if(k.indexOf("POTRZEBUJE")>-1||k.indexOf("NIEWIEM")>-1) return "otwarte";
    if(k.indexOf("CZESCIOWO")>-1) return "czesciowe"; return "pelne"; }
  function stripeOf(m,st){ var k=markers(m).map(keyOf);
    if(k.indexOf("DANGER")>-1||k.indexOf("KLAMALEM")>-1) return "--c-danger";
    if(k.indexOf("POTRZEBUJE")>-1) return "--c-action";
    return HUE[k[0]]||"--border-strong"; }
  function linkify(d){ return (/^file:\/\/\//.test(d)||/^https?:\/\//.test(d)) ? '<a href="'+attr(d)+'">'+esc(d)+'</a>' : esc(d); }
  function dowodyHtml(d){ if(!d||!d.length) return "";
    return '<ul class="dowody">'+d.map(function(x){return '<li><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg><span>'+linkify(x)+'</span></li>';}).join("")+'</ul>'; }

  function incCount(t){ return (t.items||[]).filter(function(it){return statusOf(it.m)!=="pelne";}).length; }
  function hasNeed(t){ return (t.need||[]).length>0; }

  function turnMatch(t){
    if(state.filter==="niekompletne" && incCount(t)===0) return false;
    if(state.filter==="akcja" && !hasNeed(t)) return false;
    if(state.q){
      var hay=[t.prompt].concat((t.items||[]).map(function(it){return (it.q||"")+" "+it.teza+" "+it.detal+" "+it.m+" "+(it.dow||[]).join(" ");}),(t.need||[]),(t.danger||[])).join(" ").toLowerCase();
      if(hay.indexOf(state.q.toLowerCase())<0) return false;
    }
    return true;
  }

  function renderHead(){
    document.getElementById("applabel").textContent = S.title || "Konsola Markerów";
    document.getElementById("topic").textContent = S.topic || "(brak tematu rozmowy)";
    document.getElementById("updated").textContent = S.updated ? ("zaktualizowano: "+S.updated) : "";
  }
  function renderNav(idxs){
    var nav=document.getElementById("nav"); nav.innerHTML="";
    idxs.forEach(function(i){
      var t=S.turns[i], n=i+1, marks="";
      if(incCount(t)) marks+='<span class="dot inc" title="otwarte"></span>';
      if(hasNeed(t)) marks+='<span class="dot act" title="wymaga akcji"></span>';
      if((t.danger||[]).length) marks+='<span class="dot dng" title="danger"></span>';
      var b=document.createElement("button");
      b.className="navitem"; b.setAttribute("data-n",n);
      b.innerHTML='<span class="nn">'+n+'</span><span class="nt">'+esc(t.prompt)+'</span>'+(marks?'<span class="marks">'+marks+'</span>':'');
      b.onclick=function(){ var el=document.getElementById("turn-"+n); if(el) el.scrollIntoView({block:"start"}); };
      nav.appendChild(b);
    });
  }

  function itemHtml(it, multi, i){
    var st=statusOf(it.m), stripe=stripeOf(it.m,st);
    var h='<div class="itemwrap">';
    if(multi && it.q) h+='<div class="q"><span class="qn">'+(i+1)+'.</span>'+md(it.q)+'</div>';
    h+='<details class="item" open style="--stripe:var('+stripe+')"><summary>'
      +'<div class="teza-line"><span class="teza">'+md(it.teza||"")+'</span>'
      +'<svg class="caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></div>'
      +'<div class="mrow">'+badges(it.m)+'<span class="chip '+st+'">'+STLABEL[st]+'</span></div>'
      +'</summary>';
    if((it.detal&&it.detal.trim())||(it.dow&&it.dow.length))
      h+='<div class="detal">'+(it.detal?md(it.detal):"")+dowodyHtml(it.dow)+'</div>';
    h+='</details></div>';
    return h;
  }

  function renderStream(){
    var idxs=[]; S.turns.forEach(function(t,i){ if(turnMatch(t)) idxs.push(i); });
    renderNav(idxs);
    var wrap=document.getElementById("stream");
    if(!idxs.length){ wrap.innerHTML='<div class="empty">Brak tur dla tego filtra.</div>'; return; }
    var h="";
    idxs.forEach(function(i){
      var t=S.turns[i], n=i+1, multi=(t.items||[]).length>1;
      h+='<section class="turn" id="turn-'+n+'">';
      h+='<div class="turn-eyebrow"><span class="hash">❯</span> tura '+(n<10?"0":"")+n+'</div>';
      h+='<div class="prompt">'+esc(t.prompt)+'</div>';
      h+='<div class="answers">';
      (t.items||[]).forEach(function(it,k){ h+=itemHtml(it,multi,k); });
      h+='</div>';
      if((t.danger||[]).length) h+='<div class="callout danger"><h4>⚠ DANGER</h4>'+t.danger.map(function(d){return "<p>"+md(d)+"</p>";}).join("")+'</div>';
      if((t.need||[]).length){
        h+='<div class="callout action"><h4>→ [POTRZEBUJE] · wymaga Twojej akcji</h4>';
        t.need.forEach(function(it,idx){ var key="t"+n+"-o"+idx;
          h+='<div class="need"><label>'+esc(it)+'</label><input data-key="'+key+'" placeholder="Twoja odpowiedź…" value="'+attr(answers[key]||"")+'"></div>'; });
        h+='</div>';
      }
      h+='</section>';
    });

    // kolektor
    var needs=[];
    S.turns.forEach(function(t,i){ (t.need||[]).forEach(function(it,idx){ needs.push({k:"t"+(i+1)+"-o"+idx, src:"tura "+(i+1), label:it}); }); });
    h+='<div class="collector"><h3><span class="k">[POTRZEBUJE]</span> Do uzupełnienia — zbiorczo</h3>';
    h+='<p class="hint">Wszystkie otwarte punkty z całej rozmowy w jednym miejscu. Uzupełnij i skopiuj, żeby wkleić agentowi.</p>';
    if(!needs.length) h+='<div class="empty2">Nic nie wymaga teraz Twojej akcji.</div>';
    else {
      needs.forEach(function(nd){ h+='<div class="citem"><span class="src">'+esc(nd.src)+'</span><label>'+esc(nd.label)+'</label><input data-key="'+nd.k+'" placeholder="Twoja odpowiedź…" value="'+attr(answers[nd.k]||"")+'"></div>'; });
      h+='<div class="collector-foot"><button class="btn primary" id="copyAll">Kopiuj odpowiedzi</button><span class="copied" id="copied"></span></div>';
    }
    h+='</div>';

    wrap.innerHTML=h;
    wireInputs(); wireCopy(needs); setupSpy(idxs.map(function(i){return i+1;}));
  }

  function wireInputs(){
    document.getElementById("stream").addEventListener("input",function(e){
      var inp=e.target; if(!inp.getAttribute) return;
      var k=inp.getAttribute("data-key"); if(!k) return;
      answers[k]=inp.value;
      try{ localStorage.setItem("km-answers",JSON.stringify(answers)); }catch(err){}
      Array.prototype.forEach.call(document.querySelectorAll('input[data-key="'+k+'"]'),function(o){ if(o!==inp) o.value=inp.value; });
    });
  }
  function wireCopy(needs){
    var btn=document.getElementById("copyAll"); if(!btn) return;
    btn.addEventListener("click",function(){
      var lines=needs.filter(function(n){return (answers[n.k]||"").trim();}).map(function(n){return "["+n.src+"] "+n.label+"\n→ "+answers[n.k].trim();});
      var txt=lines.join("\n\n")||"(brak uzupełnionych odpowiedzi)";
      var done=document.getElementById("copied");
      function ok(){ done.textContent="skopiowano ✓"; setTimeout(function(){done.textContent="";},2200); }
      try{ navigator.clipboard.writeText(txt).then(ok,function(){ fb(txt); ok(); }); }catch(e){ fb(txt); ok(); }
    });
  }
  function fb(txt){ var ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(e){} document.body.removeChild(ta); }

  var spy;
  function setupSpy(ns){
    if(spy) spy.disconnect();
    spy=new IntersectionObserver(function(entries){
      entries.forEach(function(en){ if(en.isIntersecting){
        var n=en.target.id.replace("turn-","");
        Array.prototype.forEach.call(document.querySelectorAll(".navitem"),function(x){ x.classList.toggle("on", x.getAttribute("data-n")===n); });
      }});
    },{rootMargin:"-12% 0px -78% 0px",threshold:0});
    ns.forEach(function(n){ var el=document.getElementById("turn-"+n); if(el) spy.observe(el); });
  }

  document.getElementById("q").addEventListener("input",function(e){ state.q=e.target.value; renderStream(); });
  document.getElementById("filters").addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    state.filter=b.getAttribute("data-f");
    Array.prototype.forEach.call(this.children,function(x){ x.classList.toggle("on",x===b); });
    renderStream();
  });
  (function(){
    var btn=document.getElementById("theme");
    try{ var s=localStorage.getItem("km-theme"); if(s) document.documentElement.setAttribute("data-theme",s); }catch(e){}
    btn.addEventListener("click",function(){
      var dark=matchMedia("(prefers-color-scheme:dark)").matches;
      var now=document.documentElement.getAttribute("data-theme")||(dark?"dark":"light");
      var next=now==="dark"?"light":"dark";
      document.documentElement.setAttribute("data-theme",next);
      try{ localStorage.setItem("km-theme",next); }catch(e){}
    });
  })();

  renderHead(); renderStream();
})();
</script>
</body>
</html>
